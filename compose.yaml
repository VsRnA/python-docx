services:
  migrate:
    image: document-service-backend:local
    build:
      context: ./backend
    command: alembic upgrade head
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://document_service:document_service@postgres:5432/document_service
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: document-service-backend:local
    build:
      context: ./backend
    command: uvicorn document_service.main:app --host 0.0.0.0 --port 8000
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://document_service:document_service@postgres:5432/document_service
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      RENDERER_URL: http://renderer:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      renderer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: document-service-backend:local
    build:
      context: ./backend
    command: >-
      celery -A document_service.infrastructure.queue.celery_app:celery_app worker
      -Q documents --loglevel=INFO --without-mingle --without-gossip
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://document_service:document_service@postgres:5432/document_service
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      DOCX_CONVERTER_URL: http://gotenberg:3000
      RENDERER_URL: http://renderer:3000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      renderer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gotenberg:
    image: gotenberg/gotenberg:8.37.0-libreoffice
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  renderer:
    build:
      context: ./renderer
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: document_service
      POSTGRES_USER: document_service
      POSTGRES_PASSWORD: document_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    # Celery/Kombu 5.x still uses global QoS, which RabbitMQ 4 rejects.
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
