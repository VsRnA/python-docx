services:
  migrate:
    image: document-service-backend:local
    build:
      context: ./backend
    command: alembic upgrade head
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://document_service:document_service@postgres:5432/document_service
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: document-service-backend:local
    build:
      context: ./backend
    command: uvicorn document_service.main:app --host 0.0.0.0 --port 8000
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://document_service:document_service@postgres:5432/document_service
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: document-service-backend:local
    build:
      context: ./backend
    command: python -m document_service.infrastructure.queue.postgres_worker
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://document_service:document_service@postgres:5432/document_service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: document_service
      POSTGRES_USER: document_service
      POSTGRES_PASSWORD: document_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
