name: quality

on:
  push:
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker services
        run: docker compose build api worker migrate frontend
      - name: Compile backend in container
        run: docker compose run --rm --no-deps api python -m compileall -q /app/src
      - name: Lint and format backend runtime
        working-directory: backend
        run: |
          python -m pip install ruff==0.9.10
          ruff check src migrations scripts
          ruff format --check src migrations scripts
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check frontend boundaries and types
        working-directory: frontend
        run: npm run check:boundaries && npm run typecheck && npm run lint
